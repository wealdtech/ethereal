name: test
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version: '^1.24'
      - uses: actions/checkout@v6
      - uses: n8maninger/action-golang-test@v2
        with:
          args: "-race;-timeout=30m"